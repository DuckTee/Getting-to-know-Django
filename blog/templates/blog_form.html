{% extends 'catalog/base.html' %}

{% block content %}
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header">
                        <h1 class="card-title">{% if view.object %}Редактировать{% else %}Создать{% endif %} статью</h1>
                    </div>
                    <div class="card-body">
                        <form method="post" enctype="multipart/form-data">
                            {% csrf_token %}
                            <div class="mb-3">
                                <label for="title" class="form-label">Заголовок</label>
                                <input type="text" name="title" class="form-control" id="title" value="{{ form.instance.title }}" required>
                            </div>
                            <div class="mb-3">
                                <label for="content" class="form-label">Содержимое</label>
                                <textarea name="content" class="form-control" id="content" rows="5" required>{{ form.instance.content }}</textarea>
                            </div>
                            <div class="mb-3">
                                <label for="preview" class="form-label">Превью</label>
                                <input type="file" name="preview" class="form-control" id="preview">
                                {% if form.instance.preview %}
                                    <img src="" alt="{{ form.instance.title }}" width="100" class="mt-2">
                                {% endif %}
                            </div>
                            <div class="mb-3 form-check">
                                <input type="checkbox" name="is_published" class="form-check-input" id="is_published" {% if form.instance.is_published %}checked{% endif %}>
                                <label class="form-check-label" for="is_published">Опубликовано</label>
                            </div>
                            <button type="submit" class="btn btn-primary">Сохранить</button>
                            <a href="{% url 'blog:blog_list' %}" class="btn btn-secondary">Отмена</a>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
