{% extends 'catalog/base.html' %}

{% block content %}
    <h1>Удалить статью</h1>
    <p>Вы уверены, что хотите удалить статью "{{ post.title }}"?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Удалить</button>
        <a href="{% url 'blog:blog_list' %}" class="btn btn-secondary">Отмена</a>
    </form>
{% endblock %}
